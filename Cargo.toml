[package]
name = "netlink-packet-amneziawg"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
homepage = "https://github.com/slipmesh/netlink-packet-amneziawg"
repository = "https://github.com/slipmesh/netlink-packet-amneziawg"
keywords = ["wireguard", "netlink", "linux", "amnezia"]
license = "MIT"
readme = "README.md"
description = "AmneziaWG generic netlink packet definitions on top of netlink-packet-wireguard"

[dependencies]
netlink-packet-core = "0.9"
netlink-packet-generic = "0.5"
netlink-packet-wireguard = "0.5.1"

[dev-dependencies]
base64 = "0.23.1"
env_logger = "0.11.11"
futures = "0.3.34"
getrandom = "0.4.2"
hex-literal = "1.1"
pretty_assertions = "1.4.1"

[target.'cfg(target_os = "linux")'.dev-dependencies]
genetlink = "0.3.1"
nix = { version = "0.31.3", features = ["user"] }
rtnetlink = "0.24"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
